<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" width="560" height="130">

  <!-- "vps" lowercase bold white (maroon on light → white on dark) -->
  <text x="10" y="80" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="64" fill="white">vps</text>

  <!-- Vertical separator -->
  <line x1="128" y1="16" x2="128" y2="96" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>

  <!-- "Lakeshore" title-case bold white -->
  <text x="142" y="80" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="64" fill="white">Lakeshore</text>

  <!-- "Medical Centre" subtitle — semi-transparent white -->
  <text x="144" y="106" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="20" fill="rgba(255,255,255,0.65)" letter-spacing="0.8">Medical Centre</text>

  <!-- Ribbon cross emblem — top right, rotated ~15° clockwise -->
  <!-- Lighter colours for visibility on dark gradient -->
  <g transform="translate(524, 65) rotate(15)">
    <!-- Light blue top arm -->
    <rect x="-12" y="-48" width="24" height="50" rx="7" ry="7" fill="#5BBFFF"/>
    <!-- Light blue right arm -->
    <rect x="0" y="-12" width="50" height="24" rx="7" ry="7" fill="#5BBFFF"/>
    <!-- Light pink/rose bottom arm -->
    <rect x="-12" y="0" width="24" height="48" rx="7" ry="7" fill="#F0608A"/>
    <!-- Light pink/rose left arm -->
    <rect x="-56" y="-12" width="50" height="24" rx="7" ry="7" fill="#F0608A"/>
    <!-- Clean centre seam -->
    <rect x="-12" y="-12" width="12" height="12" fill="#F0608A"/>
    <rect x="0" y="0" width="12" height="12" fill="#5BBFFF"/>
  </g>

</svg>
