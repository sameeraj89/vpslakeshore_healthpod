<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" width="380" height="110">

  <!-- "vps" lowercase bold blue -->
  <text x="10" y="68" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="#0072BC">vps</text>

  <!-- Maroon cross element overlaid on "p" (~x=55 centre) -->
  <!-- Horizontal bar of cross through mid-height of "p" -->
  <rect x="45" y="37" width="24" height="9" rx="2" fill="#C8103E"/>
  <!-- Vertical bar (matches ascender of p) -->
  <rect x="53" y="20" width="9" height="36" rx="2" fill="#C8103E"/>

  <!-- Vertical separator -->
  <line x1="132" y1="22" x2="132" y2="82" stroke="#B0BEC5" stroke-width="1.5"/>

  <!-- "lakeshore" bold blue -->
  <text x="144" y="68" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="#0072BC">lakeshore</text>

  <!-- "Medical Centre" subtitle in gray below lakeshore -->
  <text x="146" y="88" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="16" fill="#6B7E8F" letter-spacing="0.5">Medical Centre</text>

  <!-- Ribbon cross emblem — top right -->
  <!-- Blue ribbon: top arm + right arm -->
  <!-- Top arm (blue) -->
  <path d="M 348 12 Q 344 10 341 12 L 338 32 L 352 32 L 349 12 Q 348 10 348 12 Z" fill="#0072BC"/>
  <!-- Right arm (blue) -->
  <path d="M 352 28 L 374 30 Q 380 33 378 38 Q 376 43 370 42 L 352 40 Z" fill="#0072BC"/>

  <!-- Maroon ribbon: bottom arm + left arm -->
  <!-- Bottom arm (maroon) -->
  <path d="M 338 38 L 352 38 L 349 60 Q 347 65 344 65 Q 340 65 338 60 Z" fill="#C8103E"/>
  <!-- Left arm (maroon) -->
  <path d="M 316 30 Q 313 26 316 22 Q 319 18 323 20 L 338 28 L 338 40 L 322 42 Q 315 42 316 36 Z" fill="#C8103E"/>

  <!-- Center overlap (blend of two ribbons) -->
  <rect x="338" y="32" width="14" height="6" fill="#0072BC" opacity="0.7"/>
  <rect x="338" y="38" width="14" height="2" fill="#C8103E" opacity="0.5"/>

</svg>
